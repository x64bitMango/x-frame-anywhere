<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="X-Frame-Anywhere: custom HTML element extending IFrame to bypass X-Frame-Options: deny/sameorigin. Be able to iframe any site, regardless of CORS/x-frame policies">
    <title>X-Frame-Anywhere Demo</title>
    <script src="x-frame-anywhere.js" defer></script>
    <style>
		html, body {
		  height: 100%;
		  margin: 0;
		  padding: 0;
		}
		img {
			position: absolute;
			top: 0;
			right: 0;
		}
        iframe {
			display: block;
			width: calc(100% - 40px);
			height: 90vh;
			margin: 20px;
            border-width: 3px; 
            border-style: groove;
		}
    </style>
</head>
<body>
    <center>
    <iframe is="x-frame-anywhere" src="https://github.com/x64bitMango"></iframe>
    </center>
    <a href="https://github.com/x64bitMango/x-frame-anywhere"><img src="https://github.blog/wp-content/uploads/2008/12/forkme_right_gray_6d6d6d.png" alt="Fork me on GitHub"></a>
</body>
</html>
